# The house CI/CD pipeline for BeeSec's app-shaped repos: a Python 3.11
# Azure Functions API under api/ plus a Vite/React SPA under web/, deployed
# to a Function App and a Static Web App. honeycomb, nectar, propolis,
# diapause, beeline, hive and the rest of the fleet are all this shape by
# design (orchestrator/standards/stack.md), so the pipeline lives here ONCE
# and each repo calls it with its own names. Fix it here and every app is
# corrected on its next run.
#
# Cost rules baked in, in order of what they save:
#   - ONE consolidated test job. GitHub bills each job rounded UP to a full
#     minute plus VM spin-up, so five 40-second jobs cost five minutes where
#     one two-minute job costs two. Repo-specific checks ride the same job
#     via `extra_gate_script` rather than becoming jobs of their own.
#   - pip and npm caches, so the gate does not rebuild its toolbox each run.
#   - Deploys run on push to main (and manual dispatch) only — never on PRs.
#     PR preview environments are deliberately not supported: they doubled
#     the frontend build bill and the stale previews were not being used.
#   - Callers add a concurrency group cancelling superseded PR runs (see the
#     caller stub below).
#
# What a caller looks like (this is the ENTIRE per-repo workflow):
#
#   name: Deploy <app>
#   on:
#     push: { branches: [main] }
#     pull_request: { branches: [main] }
#     workflow_dispatch:
#   permissions:
#     contents: read
#     id-token: write      # only needed for api_deploy_mode: run-from-package
#   concurrency:
#     group: ${{ github.workflow }}-${{ github.ref }}
#     cancel-in-progress: ${{ github.event_name == 'pull_request' }}
#   jobs:
#     pipeline:
#       uses: BeeSec-UK/.github/.github/workflows/beesec-app.yml@main
#       secrets: inherit
#       with:
#         function_app: func-<app>-prod
#         ...
#
# Secrets are taken from the calling repo via `secrets: inherit`, under the
# names the fleet already uses: AZURE_STATIC_WEB_APPS_API_TOKEN for the SWA
# deploy and, in publish-profile mode only, AZURE_FUNCTIONAPP_PUBLISH_PROFILE.
# run-from-package mode needs no stored secret at all — it authenticates by
# OIDC as a managed identity federated to the caller repo's main branch.

name: BeeSec app pipeline

on:
  workflow_call:
    inputs:
      # ---- test gate -------------------------------------------------------
      python_version:
        type: string
        default: '3.11'
      node_version:
        type: string
        default: '20'
      apt_packages:
        description: System packages the backend tests need (e.g. the WeasyPrint native stack). Space-separated.
        type: string
        default: ''
      requirements_path:
        description: Requirements file the TEST gate installs (a repo with a dev-requirements file names it here).
        type: string
        default: 'api/requirements.txt'
      package_requirements_path:
        description: Requirements file VENDORED into the deployed package. Kept separate from requirements_path so test-only tooling can never ship to the Function host.
        type: string
        default: 'api/requirements.txt'
      extra_pip:
        description: Test-only pip packages, kept out of the requirements file so they never ship.
        type: string
        default: 'pytest'
      pytest_workdir:
        type: string
        default: 'api'
      pytest_args:
        type: string
        default: '-q'
      has_web:
        description: Set false for an API-only app (e.g. apitoxin) — all web steps are skipped.
        type: boolean
        default: true
      npm_install_command:
        type: string
        default: 'npm ci'
      typecheck_command:
        description: Must check the real projects. For project-references builds this is `npx tsc -b` — bare `--noEmit` checks nothing under them.
        type: string
        default: 'npx tsc -b'
      run_vitest:
        type: boolean
        default: true
      vitest_command:
        type: string
        default: 'npx vitest run'
      extra_gate_script:
        description: Repo-specific checks (hygiene greps, codegen drift, infra tests). Runs from the repo root, in the SAME job, after the standard gate — Python and node_modules are already set up.
        type: string
        default: ''
      # ---- frontend deploy -------------------------------------------------
      deploy_swa:
        type: boolean
        default: true
      app_location:
        type: string
        default: 'web'
      output_location:
        type: string
        default: 'dist'
      app_build_command:
        type: string
        default: 'npm install && npm run build'
      frontend_build_env:
        description: |
          Vite build-time env as KEY=VALUE lines (VITE_PLATFORM_* etc.). SWA app
          settings reach the Functions runtime, NOT the Oryx build, so these MUST
          be set on the build job — see standards/msal-pivot-playbook.md §2.
          Values are non-secret: they ship in the public bundle anyway.
        type: string
        default: ''
      # ---- API deploy -------------------------------------------------------
      deploy_api:
        type: boolean
        default: true
      api_deploy_mode:
        description: >-
          'run-from-package' (preferred: OIDC managed identity, zip in the
          releases container, no stored secret) or 'publish-profile'
          (Azure/functions-action with the AZURE_FUNCTIONAPP_PUBLISH_PROFILE
          secret, for apps whose managed identity is not federated yet).
        type: string
        default: 'run-from-package'
      function_app:
        type: string
        default: ''
      resource_group:
        type: string
        default: ''
      storage_account:
        type: string
        default: ''
      releases_container:
        type: string
        default: 'function-releases'
      azure_client_id:
        description: Managed identity client id (public identifier, not a secret). run-from-package mode only.
        type: string
        default: ''
      azure_tenant_id:
        type: string
        default: ''
      azure_subscription_id:
        type: string
        default: ''
      post_deploy_script:
        description: Extra publishing the deploy carries (e.g. honeycomb's house-template sync). Runs after the package flip, with the az OIDC session still live — run-from-package mode only.
        type: string
        default: ''
      smoke_path:
        type: string
        default: '/api/healthz'
      smoke_expect_sha:
        description: Require the deployed commit sha in the smoke response, proving the NEW build answers rather than a still-warm previous worker. Needs healthz to echo APP_VERSION.
        type: boolean
        default: false

      prefer_runner:
        description: >-
          JSON array of labels for the runner to PREFER, used only while one
          of them is online and idle. GitHub itself has no preference between
          matching runners: a queued job goes to whichever answers first, and
          a box that polls faster wins every race. So a short first job asks
          the API which preferred runner is free and hands the rest of the
          run its runs-on: the preferred labels when one is free, `runner`
          otherwise. Needs RUNNER_STATUS_TOKEN (see the pick job); without it,
          or with this empty, the run uses `runner` exactly as before.
        type: string
        default: ''

      parallel_web_gate:
        description: >-
          Run the web gate (npm install, typecheck, vitest) as its own job
          beside pytest instead of after it. Halves the wall clock of a run
          that has two runners to land on, and costs a second checkout and
          Node setup, so it is opt-in: only worth it for an app whose two
          halves both run for minutes and whose runner pool has more than
          one machine. With one runner the two jobs queue in series and
          nothing is gained.
        type: boolean
        default: false

      runner:
        description: JSON array of runner labels. Default keeps GitHub-hosted; pass '["self-hosted","linux","x64"]' to run on the org self-hosted runner.
        type: string
        default: '["self-hosted","linux","x64"]'

      path_gates:
        description: >-
          Run only the half of the gate the change touched, and deploy only
          the half it touched. The pick job reads the changed files from the
          compare API: `api/`, `docs/templates/` and `.github/` are the API
          half, `web/` and `.github/` the web half, and a change outside
          both (docs, README, scripts, the capability map) runs no tests and
          deploys nothing. Any failure to read the diff runs everything. The
          secret scan still runs on every push, in the pick job when the
          gate is skipped. Opt-in per caller; needs only `contents: read`.
        type: boolean
        default: false

      trust_pr_gate:
        description: >-
          On a push to main that is the squash merge of a pull request, skip
          the tests when the pushed commit's TREE is the tree the PR's head
          already passed the gate on: the same files, byte for byte, so the
          same tests would give the same answer. A PR merged behind main has
          a different tree and is tested again. Needs `pull-requests: read`
          and `checks: read` in the caller's permissions; without them, or on
          any API failure, the tests run as before. Opt-in per caller.
        type: boolean
        default: false

    outputs:
      # For a caller that keeps its own deploy jobs (propolis, apiary): the
      # pick job's verdict, so `needs.pipeline.outputs.deploy_api == 'true'`
      # gates a custom deploy the same way the built-in ones are gated.
      # Always 'true' unless path_gates is on.
      deploy_api:
        description: Whether the change touched the API half (or path_gates is off).
        value: ${{ jobs.pick.outputs.deploy_api }}
      deploy_web:
        description: Whether the change touched the web half (or path_gates is off).
        value: ${{ jobs.pick.outputs.deploy_web }}
      tests:
        description: Whether the gate ran at all on this run.
        value: ${{ jobs.pick.outputs.tests }}

jobs:
  # Which runner the rest of the run lands on. See `prefer_runner`. The
  # runners API needs a token that may list runners, which GITHUB_TOKEN
  # cannot: RUNNER_STATUS_TOKEN is a fine-grained PAT with read on
  # "Administration" for the repo (or "Self-hosted runners" on the org),
  # stored as an org secret. Every failure, a missing token, a 403, a
  # network blip, falls back to `runner`, so this job can slow a run down
  # by twenty seconds and can never stop one. The status is read at the
  # repo AND the org, because a workstation may be registered at either.
  pick:
    name: Pick a runner
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 3
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
      api: ${{ steps.scope.outputs.api }}
      web: ${{ steps.scope.outputs.web }}
      tests: ${{ steps.scope.outputs.tests }}
      deploy_api: ${{ steps.scope.outputs.deploy_api }}
      deploy_web: ${{ steps.scope.outputs.deploy_web }}
    steps:
      - id: pick
        env:
          PREFER: ${{ inputs.prefer_runner }}
          DEFAULT: ${{ inputs.runner }}
          TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          REPO: ${{ github.repository }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -u
          choose="$DEFAULT"
          if [ -n "$PREFER" ] && [ -n "${TOKEN:-}" ]; then
            want=$(printf '%s' "$PREFER" | jq -r '.[]' | tr 'A-Z' 'a-z' | sort)
            free=0
            for scope in "repos/$REPO" "orgs/$ORG"; do
              json=$(curl -sS --max-time 15 -H "Authorization: Bearer $TOKEN"                        -H "Accept: application/vnd.github+json"                        "https://api.github.com/$scope/actions/runners?per_page=100" 2>/dev/null) || continue
              n=$(printf '%s' "$json" | jq -r --argjson want "$(printf '%s' "$PREFER" | jq -c '[.[]|ascii_downcase]')" '
                [ .runners[]? | select(.status=="online" and .busy==false)
                  | [.labels[].name | ascii_downcase] as $have
                  | select(($want - $have) == []) ] | length' 2>/dev/null || echo 0)
              free=$((free + ${n:-0}))
            done
            if [ "${free:-0}" -gt 0 ]; then
              choose="$PREFER"
              echo "preferred runner free ($free idle): $PREFER"
            else
              echo "no preferred runner idle; using $DEFAULT"
            fi
          else
            echo "no preference or no RUNNER_STATUS_TOKEN; using $DEFAULT"
          fi
          echo "labels=$choose" >> "$GITHUB_OUTPUT"

      # What this run has to do. Two opt-in narrowings, each answered from
      # the API without a checkout, each falling back to "everything" the
      # moment anything is unreadable, because a run that does too much is
      # a cost and a run that does too little is a deploy nobody tested.
      #
      #   path_gates     which halves the change touched (see the input)
      #   trust_pr_gate  whether main's tree is one a PR already passed on
      #
      # The outputs gate the jobs below: `tests` whether the gate runs at
      # all, `api`/`web` which halves inside it, `deploy_*` which deploys.
      - id: scope
        env:
          PATH_GATES: ${{ inputs.path_gates }}
          TRUST: ${{ inputs.trust_pr_gate }}
          HAS_WEB: ${{ inputs.has_web }}
          PARALLEL_WEB: ${{ inputs.parallel_web_gate }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          api=true; web=true; reason="everything: gates off"
          gh_api() { curl -sS --max-time 20 -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/$1"; }

          if [ "$PATH_GATES" = "true" ]; then
            range=""
            case "$EVENT" in
              pull_request) range="$PR_BASE...$PR_HEAD" ;;
              push) case "$BEFORE" in 0000000000000000000000000000000000000000|"") range="" ;; *) range="$BEFORE...$SHA" ;; esac ;;
            esac
            files=""
            if [ -n "$range" ]; then
              cmp=$(gh_api "repos/$REPO/compare/$range?per_page=1" 2>/dev/null) || cmp=""
              # An error body has no `files` array, and jq's length of null
              # is 0, which would read as "nothing changed" and deploy
              # nothing: so the array must be there, non-empty and under
              # the API's 300-file cap, or the run does everything.
              n=$(printf '%s' "$cmp" | jq -r 'if (.files|type)=="array" then (.files|length) else empty end' 2>/dev/null || echo "")
              if [ -n "$n" ] && [ "$n" -gt 0 ] && [ "$n" -lt 300 ] 2>/dev/null; then
                files=$(printf '%s' "$cmp" | jq -r '.files[].filename')
                api=false; web=false
                while IFS= read -r f; do
                  [ -z "$f" ] && continue
                  case "$f" in
                    api/*|docs/templates/*|.github/*) api=true ;;
                  esac
                  case "$f" in
                    web/*|.github/*) web=true ;;
                  esac
                done <<< "$files"
                reason="changed: api=$api web=$web ($(printf '%s\n' "$files" | grep -c .) files)"
              else
                reason="everything: could not read the diff for $range"
              fi
            else
              reason="everything: no range for event $EVENT"
            fi
          fi
          [ "$HAS_WEB" = "true" ] || web=false

          tests=true
          if [ "$TRUST" = "true" ] && [ "$EVENT" = "push" ]; then
            head=$(gh_api "repos/$REPO/commits/$SHA/pulls" 2>/dev/null | jq -r '[.[]|select(.merged_at!=null)][0].head.sha // empty' 2>/dev/null || echo "")
            if [ -n "$head" ]; then
              t1=$(gh_api "repos/$REPO/git/commits/$SHA" | jq -r '.tree.sha // empty' 2>/dev/null || echo "")
              t2=$(gh_api "repos/$REPO/git/commits/$head" | jq -r '.tree.sha // empty' 2>/dev/null || echo "")
              if [ -n "$t1" ] && [ "$t1" = "$t2" ]; then
                runs=$(gh_api "repos/$REPO/commits/$head/check-runs?per_page=100" 2>/dev/null) || runs=""
                ok_py=$(printf '%s' "$runs" | jq -r '[.check_runs[]?|select(.name|test("Tests \\(pytest"))|.conclusion]|first // empty' 2>/dev/null || echo "")
                ok_web=success
                if [ "$HAS_WEB" = "true" ] && [ "$PARALLEL_WEB" = "true" ]; then
                  ok_web=$(printf '%s' "$runs" | jq -r '[.check_runs[]?|select(.name|test("Tests \\(web gate"))|.conclusion]|first // empty' 2>/dev/null || echo "")
                fi
                if [ "$ok_py" = "success" ] && [ "$ok_web" = "success" ]; then
                  tests=false
                  reason="$reason; tree $t1 already passed the gate on PR head ${head:0:7}"
                else
                  reason="$reason; PR head ${head:0:7} shares the tree but its gate was '$ok_py'/'$ok_web', testing again"
                fi
              else
                reason="$reason; PR head ${head:0:7} has a different tree, testing again"
              fi
            else
              reason="$reason; no merged PR found for $SHA, testing"
            fi
          fi
          if [ "$api" != "true" ] && [ "$web" != "true" ]; then tests=false; fi

          echo "$reason"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "deploy_api=$api" >> "$GITHUB_OUTPUT"
          echo "deploy_web=$web" >> "$GITHUB_OUTPUT"

      # The secret scan is the gate's first step, so a run that skips the
      # gate would skip the scan with it. It runs here instead in that case,
      # on the same commit, with the same config: a docs-only change is the
      # kind of change a pasted key hides in.
      - uses: actions/checkout@v4
        if: steps.scope.outputs.tests != 'true'
      - name: Secret scan (gitleaks), because the gate is skipped
        if: steps.scope.outputs.tests != 'true'
        run: |
          set -euo pipefail
          VER=8.28.0
          curl -sSL --retry 3 -o /tmp/gl.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          tar xzf /tmp/gl.tgz -C /tmp gitleaks
          curl -sSL --retry 3 -o /tmp/gitleaks.toml \
            https://raw.githubusercontent.com/BeeSec-UK/.github/main/.gitleaks.toml
          /tmp/gitleaks dir . -c /tmp/gitleaks.toml --no-banner --redact --exit-code 1

  gate:
    name: Tests (pytest + web gate)
    needs: pick
    if: needs.pick.outputs.tests == 'true'
    runs-on: ${{ fromJSON(needs.pick.outputs.labels) }}
    # Bounded because nothing else is. GitHub's default job timeout is 360
    # minutes, and on 2026-08-19 a honeycomb PR run hung to exactly that --
    # 360.8 minutes from ONE job, about 16% of the whole org's 30-day Actions
    # consumption, while every other run that day finished in 2 to 6 minutes.
    # This job normally takes ~2.8 min, so 15 leaves roughly 5x headroom and
    # turns a hang into a 15-minute loss instead of a six-hour one.
    #
    # A cap is not a diagnosis. If runs start hitting it, something is wrong
    # and the timeout is only stopping it being expensive.
    timeout-minutes: 15
    steps:
      # A self-hosted runner keeps its workspace between runs, and the SWA
      # deploy is a Docker action that runs as root and does its own
      # `npm install && npm run build` inside it. That leaves a root-owned
      # `web/` behind, and the next job to land on that runner cannot clean
      # it: `git clean -ffdx` reports "Permission denied" on every file,
      # checkout falls back to recreating the repository, and that dies on
      # `EACCES: permission denied, unlink .../web/.env.example` before a
      # line of the job has run. It is not the job that caused it that pays
      # — propolis PRs 78 and 79 died here on 9 Sep 2026 in the gate, which
      # never builds the SPA, and apiary has had the same.
      #
      # So every job reclaims the workspace before checking out. `sudo` is
      # passwordless for the runner account on the self-hosted boxes and the
      # whole thing is swallowed, so this is a no-op on a GitHub-hosted
      # runner where the workspace is fresh anyway. Nothing is deleted here:
      # checkout's own `git clean` does the deleting, and ownership was the
      # only thing standing in its way. `-h` so the symlink farm in
      # `node_modules/.bin` is retargeted rather than followed. Where the
      # runner account has no passwordless sudo (a workstation registered by
      # hand), the step cannot fix anything, so it names the foreign files
      # in the log and lets checkout show its own error, which is a better
      # trail than a silent `|| true` followed by an EACCES nobody can place.
      #
      # The job that leaves the mess behind, `deploy_frontend`, also hands
      # the workspace back after its Docker step (see there), so a poisoned
      # runner is the exception this step exists for and not the rule.
      - name: Reclaim the workspace from a root-owned build
        run: |
          [ -d "$GITHUB_WORKSPACE" ] || exit 0
          if sudo -n true 2>/dev/null; then
            sudo -n chown -Rh "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
          else
            foreign=$(find "$GITHUB_WORKSPACE" ! -user "$(id -un)" -print 2>/dev/null | head -n 20)
            if [ -n "$foreign" ]; then
              echo "::warning::no passwordless sudo on this runner and the workspace holds files owned by another user; checkout may fail on them"
              printf '%s\n' "$foreign"
            fi
          fi

      - uses: actions/checkout@v4
        with:
          submodules: true

      # SECRET SCAN FIRST, before anything expensive.
      #
      # Two credential dumps were found by accident on 2026-08-20, both from the
      # same 2026-05-27 migration session and both sitting untracked for twelve
      # weeks: apitoxin (Cosmos key, Nessus keys, production user/session
      # exports) and swarm (ENTRA_CLIENT_SECRET for the SHARED registration,
      # SWARM_JWT_SECRET, a storage connection string). Neither was found by
      # looking. One surfaced during an unrelated dirty-tree sweep, the other
      # during a Prettier failure three months later.
      #
      # BE CLEAR ABOUT WHAT THIS DOES AND DOES NOT CATCH. It would NOT have
      # caught either of those, because they were never committed and CI only
      # ever sees committed content. It catches the WORSE case -- a secret that
      # does reach a branch and therefore GitHub. The local half of the problem
      # needs a pre-commit hook and is not solved here.
      #
      # Config lives in BeeSec-UK/.github/.gitleaks.toml so the estate tunes it
      # in ONE place. It extends the upstream default ruleset and narrows only
      # the entropy-based `generic-api-key` rule, in paths where a key-shaped
      # string is expected: samples, fixtures, tests, vendored source, bicep
      # (listKeys/Key Vault references) and docs. High-confidence rules --
      # private keys, AWS, Azure AD client secrets, GitHub tokens -- are
      # untouched and still fire everywhere.
      #
      # Verified before adoption: 0 findings across all eight callers, while
      # still flagging both real dumps (including azure-ad-client-secret) and a
      # synthetic secret planted in an ordinary config.json. An allowlist that
      # silences everything is worse than no scan, so both directions were
      # tested.
      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          VER=8.28.0
          curl -sSL --retry 3 -o /tmp/gl.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          tar xzf /tmp/gl.tgz -C /tmp gitleaks
          curl -sSL --retry 3 -o /tmp/gitleaks.toml \
            https://raw.githubusercontent.com/BeeSec-UK/.github/main/.gitleaks.toml
          # Scan the checked-out tree. `git` mode would rescan full history on
          # every run for no extra safety once history is known clean.
          /tmp/gitleaks dir . -c /tmp/gitleaks.toml --no-banner --redact --exit-code 1

      # Only when something is missing. A self-hosted runner keeps its
      # packages between runs, so on every run after the first this was an
      # apt-get update for nothing, and on a workstation runner without
      # passwordless sudo it was the one step that could not run at all.
      - name: Install system packages
        if: inputs.apt_packages != '' && (needs.pick.outputs.api == 'true' || inputs.extra_gate_script != '')
        run: |
          missing=""
          for p in ${{ inputs.apt_packages }}; do
            dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"
          done
          if [ -n "$missing" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends $missing
          else
            echo "every package is already installed"
          fi

      - name: Set up Python
        if: needs.pick.outputs.api == 'true' || inputs.extra_gate_script != ''
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          # The GitHub cache only pays on a GitHub-hosted runner, whose disk
          # is new every run. A self-hosted runner keeps ~/.cache/pip between
          # runs, so restoring a tarball of it from GitHub is a download it
          # does not need and, on a workstation's uplink, one it cannot
          # finish: honeycomb's deploy on 2026-09-09 spent 14 minutes in
          # "Set up Python" before "Aborting cache download as the download
          # time exceeded the timeout", then pip used the local cache anyway
          # (run 34372785601). The tests took 49 seconds.
          cache: ${{ runner.environment == 'github-hosted' && 'pip' || '' }}
          cache-dependency-path: ${{ inputs.requirements_path }}

      - name: Install API dependencies
        if: needs.pick.outputs.api == 'true' || inputs.extra_gate_script != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ inputs.requirements_path }} ${{ inputs.extra_pip }}

      - name: Backend tests (pytest)
        if: needs.pick.outputs.api == 'true'
        working-directory: ${{ inputs.pytest_workdir }}
        env:
          APP_ENV: local
        run: python -m pytest ${{ inputs.pytest_args }}

      - name: Set up Node
        if: inputs.has_web && !inputs.parallel_web_gate && (needs.pick.outputs.web == 'true' || inputs.extra_gate_script != '')
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          # See the gate's Set up Python: no GitHub cache on a self-hosted box.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        if: inputs.has_web && !inputs.parallel_web_gate && (needs.pick.outputs.web == 'true' || inputs.extra_gate_script != '')
        working-directory: web
        run: ${{ inputs.npm_install_command }}

      - name: Typecheck
        if: inputs.has_web && !inputs.parallel_web_gate && needs.pick.outputs.web == 'true'
        working-directory: web
        run: ${{ inputs.typecheck_command }}

      - name: Frontend tests (vitest)
        if: inputs.has_web && inputs.run_vitest && !inputs.parallel_web_gate && needs.pick.outputs.web == 'true'
        working-directory: web
        run: ${{ inputs.vitest_command }}

      - name: Repo-specific gates
        if: inputs.extra_gate_script != ''
        run: ${{ inputs.extra_gate_script }}

  # The web half of the gate as its own job, when the caller asks for it.
  # Same steps `gate` runs for the web, minus the secret scan, which `gate`
  # already did on the same commit. Skipped entirely, not run empty, when
  # the caller has not opted in: an empty job is still a checkout on a
  # runner, and the org's cost rule is that nothing under two minutes gets
  # to be its own job.
  gate_web:
    name: Tests (web gate)
    needs: pick
    if: inputs.has_web && inputs.parallel_web_gate && needs.pick.outputs.tests == 'true' && needs.pick.outputs.web == 'true'
    runs-on: ${{ fromJSON(needs.pick.outputs.labels) }}
    timeout-minutes: 15
    steps:
      - name: Reclaim the workspace from a root-owned build
        run: |
          [ -d "$GITHUB_WORKSPACE" ] || exit 0
          if sudo -n true 2>/dev/null; then
            sudo -n chown -Rh "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
          else
            foreign=$(find "$GITHUB_WORKSPACE" ! -user "$(id -un)" -print 2>/dev/null | head -n 20)
            if [ -n "$foreign" ]; then
              echo "::warning::no passwordless sudo on this runner and the workspace holds files owned by another user; checkout may fail on them"
              printf '%s\n' "$foreign"
            fi
          fi

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          # See the gate's Set up Python: no GitHub cache on a self-hosted box.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: ${{ inputs.npm_install_command }}

      - name: Typecheck
        working-directory: web
        run: ${{ inputs.typecheck_command }}

      - name: Frontend tests (vitest)
        if: inputs.run_vitest
        working-directory: web
        run: ${{ inputs.vitest_command }}

  deploy_frontend:
    name: Frontend (SWA)
    # Both halves of the gate, where the web half ran at all. `always()` is
    # what lets a skipped `gate_web` count: without it a skipped need skips
    # every dependant. The result checks are what keep a failed or cancelled
    # gate from deploying, which `always()` alone would allow.
    needs: [pick, gate, gate_web]
    # A skipped gate counts only when the pick job skipped it on purpose:
    # `tests` false means the tree already passed, or nothing testable
    # changed, and in the second case `deploy_web` is false as well.
    if: >-
      always()
      && (needs.gate.result == 'success' || (needs.gate.result == 'skipped' && needs.pick.outputs.tests != 'true'))
      && (needs.gate_web.result == 'success' || needs.gate_web.result == 'skipped')
      && needs.pick.outputs.deploy_web == 'true'
      && inputs.deploy_swa && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ fromJSON(needs.pick.outputs.labels) }}
    # ~1.8 min normally. See the note on `gate` for why this exists.
    timeout-minutes: 15
    steps:
      # A self-hosted runner keeps its workspace between runs, and the SWA
      # deploy is a Docker action that runs as root and does its own
      # `npm install && npm run build` inside it. That leaves a root-owned
      # `web/` behind, and the next job to land on that runner cannot clean
      # it: `git clean -ffdx` reports "Permission denied" on every file,
      # checkout falls back to recreating the repository, and that dies on
      # `EACCES: permission denied, unlink .../web/.env.example` before a
      # line of the job has run. It is not the job that caused it that pays
      # — propolis PRs 78 and 79 died here on 9 Sep 2026 in the gate, which
      # never builds the SPA, and apiary has had the same.
      #
      # So every job reclaims the workspace before checking out. `sudo` is
      # passwordless for the runner account on the self-hosted boxes and the
      # whole thing is swallowed, so this is a no-op on a GitHub-hosted
      # runner where the workspace is fresh anyway. Nothing is deleted here:
      # checkout's own `git clean` does the deleting, and ownership was the
      # only thing standing in its way. `-h` so the symlink farm in
      # `node_modules/.bin` is retargeted rather than followed. Where the
      # runner account has no passwordless sudo (a workstation registered by
      # hand), the step cannot fix anything, so it names the foreign files
      # in the log and lets checkout show its own error, which is a better
      # trail than a silent `|| true` followed by an EACCES nobody can place.
      #
      # The job that leaves the mess behind, `deploy_frontend`, also hands
      # the workspace back after its Docker step (see there), so a poisoned
      # runner is the exception this step exists for and not the rule.
      - name: Reclaim the workspace from a root-owned build
        run: |
          [ -d "$GITHUB_WORKSPACE" ] || exit 0
          if sudo -n true 2>/dev/null; then
            sudo -n chown -Rh "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
          else
            foreign=$(find "$GITHUB_WORKSPACE" ! -user "$(id -un)" -print 2>/dev/null | head -n 20)
            if [ -n "$foreign" ]; then
              echo "::warning::no passwordless sudo on this runner and the workspace holds files owned by another user; checkout may fail on them"
              printf '%s\n' "$foreign"
            fi
          fi

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Export build-time env
        if: inputs.frontend_build_env != ''
        run: |
          while IFS= read -r line; do
            case "$line" in
              *=*) echo "$line" >> "$GITHUB_ENV" ;;
            esac
          done <<'BEESEC_BUILD_ENV'
          ${{ inputs.frontend_build_env }}
          BEESEC_BUILD_ENV

      # BUILD ON THE RUNNER, NOT IN ORYX.
      #
      # The SWA build container ships an older glibc than rollup 4's native
      # binary needs, so an in-container `npm install && npm run build` dies:
      #
      #   Cannot find module @rollup/rollup-linux-x64-gnu
      #   [cause] libc.so.6: version `GLIBC_2.32' not found
      #   Oryx has failed to build the solution.
      #
      # That is npm's optional-dependency bug meeting a stale base image, and no
      # version pin is stable against it -- it returns whenever either side
      # moves. varroa hit it on 2026-08-20 and hive hit the identical failure the
      # same day on adopting this pipeline. Every caller is exposed.
      #
      # The runner has a current glibc. Building here and handing Oryx a finished
      # bundle removes the class of failure rather than the instance.
      #
      # The caller contract is UNCHANGED: app_location and output_location still
      # mean what they did. This step composes them into the built path and sets
      # skip_app_build, so callers need no edit.
      - name: Set up Node
        if: inputs.app_build_command != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Build frontend
        if: inputs.app_build_command != ''
        working-directory: ${{ inputs.app_location }}
        run: ${{ inputs.app_build_command }}

      - name: Deploy SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # With skip_app_build the action uploads app_location VERBATIM and
          # ignores output_location, so the built path must be composed here.
          # Getting this wrong ships the source tree and the browser is served a
          # raw .tsx as application/octet-stream -- a blank page, from a green run.
          app_location: ${{ inputs.app_build_command != '' && format('{0}/{1}', inputs.app_location, inputs.output_location) || inputs.app_location }}
          api_location: ""
          output_location: ""
          skip_app_build: ${{ inputs.app_build_command != '' }}

      # The cause of the root-owned workspace, handled at the source. The step
      # above runs as root inside a container with the workspace mounted, and
      # what it writes stays root-owned on a self-hosted runner after the job
      # ends, poisoning the next checkout to land there (propolis#77). Hand
      # the workspace back to the runner account before leaving, whether the
      # deploy succeeded or not: `always()` so a failed deploy still cleans
      # up, and swallowed so a runner without sudo, or a GitHub-hosted one
      # about to be discarded, is not failed by it.
      - name: Hand the workspace back after the root-owned deploy
        if: always()
        run: |
          [ -d "$GITHUB_WORKSPACE" ] || exit 0
          sudo -n chown -Rh "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" 2>/dev/null || true

  deploy_api:
    name: API (Function App)
    needs: [pick, gate, gate_web]
    if: >-
      always()
      && (needs.gate.result == 'success' || (needs.gate.result == 'skipped' && needs.pick.outputs.tests != 'true'))
      && (needs.gate_web.result == 'success' || needs.gate_web.result == 'skipped')
      && needs.pick.outputs.deploy_api == 'true'
      && inputs.deploy_api && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ fromJSON(needs.pick.outputs.labels) }}
    # ~1.6 min normally. See the note on `gate` for why this exists.
    timeout-minutes: 15
    steps:
      # A self-hosted runner keeps its workspace between runs, and the SWA
      # deploy is a Docker action that runs as root and does its own
      # `npm install && npm run build` inside it. That leaves a root-owned
      # `web/` behind, and the next job to land on that runner cannot clean
      # it: `git clean -ffdx` reports "Permission denied" on every file,
      # checkout falls back to recreating the repository, and that dies on
      # `EACCES: permission denied, unlink .../web/.env.example` before a
      # line of the job has run. It is not the job that caused it that pays
      # — propolis PRs 78 and 79 died here on 9 Sep 2026 in the gate, which
      # never builds the SPA, and apiary has had the same.
      #
      # So every job reclaims the workspace before checking out. `sudo` is
      # passwordless for the runner account on the self-hosted boxes and the
      # whole thing is swallowed, so this is a no-op on a GitHub-hosted
      # runner where the workspace is fresh anyway. Nothing is deleted here:
      # checkout's own `git clean` does the deleting, and ownership was the
      # only thing standing in its way. `-h` so the symlink farm in
      # `node_modules/.bin` is retargeted rather than followed. Where the
      # runner account has no passwordless sudo (a workstation registered by
      # hand), the step cannot fix anything, so it names the foreign files
      # in the log and lets checkout show its own error, which is a better
      # trail than a silent `|| true` followed by an EACCES nobody can place.
      #
      # The job that leaves the mess behind, `deploy_frontend`, also hands
      # the workspace back after its Docker step (see there), so a poisoned
      # runner is the exception this step exists for and not the rule.
      - name: Reclaim the workspace from a root-owned build
        run: |
          [ -d "$GITHUB_WORKSPACE" ] || exit 0
          if sudo -n true 2>/dev/null; then
            sudo -n chown -Rh "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
          else
            foreign=$(find "$GITHUB_WORKSPACE" ! -user "$(id -un)" -print 2>/dev/null | head -n 20)
            if [ -n "$foreign" ]; then
              echo "::warning::no passwordless sudo on this runner and the workspace holds files owned by another user; checkout may fail on them"
              printf '%s\n' "$foreign"
            fi
          fi

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          # See the gate's Set up Python: no GitHub cache on a self-hosted box.
          cache: ${{ runner.environment == 'github-hosted' && 'pip' || '' }}
          cache-dependency-path: ${{ inputs.package_requirements_path }}

      - name: Vendor dependencies into the package
        run: |
          python -m pip install --upgrade pip
          pip install \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version ${{ inputs.python_version }} \
            --only-binary=:all: \
            --upgrade \
            -r ${{ inputs.package_requirements_path }} \
            --target="api/.python_packages/lib/site-packages"

      - name: Stamp the build with the commit it came from
        # functions-action and run-from-package can both report success while
        # Linux Consumption serves the previous package for a while longer.
        # The stamp (and APP_VERSION in run-from-package mode) is what lets
        # the smoke step tell a fix that does not work from a fix that is
        # not running.
        run: echo "${{ github.sha }}" > api/build-stamp.txt

      - name: Azure login (OIDC, no password)
        if: inputs.api_deploy_mode == 'run-from-package'
        uses: azure/login@v2
        with:
          client-id: ${{ inputs.azure_client_id }}
          tenant-id: ${{ inputs.azure_tenant_id }}
          subscription-id: ${{ inputs.azure_subscription_id }}

      - name: Package, upload and flip run-from-package
        if: inputs.api_deploy_mode == 'run-from-package'
        run: |
          set -euo pipefail
          cd api
          # Zip from inside api/ so host.json + function_app.py sit at the
          # package root, where the Functions host expects them.
          zip -qr "../${{ inputs.function_app }}-${{ github.sha }}.zip" . \
            -x '*.pyc' -x '*/__pycache__/*' -x 'local.settings.json*'
          cd ..
          az storage blob upload \
            --account-name "${{ inputs.storage_account }}" \
            --container-name "${{ inputs.releases_container }}" \
            --name "${{ inputs.function_app }}-${{ github.sha }}.zip" \
            --file "${{ inputs.function_app }}-${{ github.sha }}.zip" \
            --auth-mode login --overwrite --only-show-errors
          PKG_URL="https://${{ inputs.storage_account }}.blob.core.windows.net/${{ inputs.releases_container }}/${{ inputs.function_app }}-${{ github.sha }}.zip"
          az functionapp config appsettings set \
            -g "${{ inputs.resource_group }}" -n "${{ inputs.function_app }}" \
            --settings "WEBSITE_RUN_FROM_PACKAGE=${PKG_URL}" "APP_VERSION=${{ github.sha }}" \
            --only-show-errors --output none
          az functionapp restart \
            -g "${{ inputs.resource_group }}" -n "${{ inputs.function_app }}" \
            --only-show-errors
          echo "Deployed ${PKG_URL}"

      - name: Deploy Function App (publish profile)
        if: inputs.api_deploy_mode == 'publish-profile'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ inputs.function_app }}
          package: api
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: false
          enable-oryx-build: false

      - name: Post-deploy publishing
        if: inputs.post_deploy_script != ''
        run: ${{ inputs.post_deploy_script }}

      - name: Smoke test the deployed host
        # A restart command returning is not a working host: the v2 indexer
        # re-imports every module on start, and one bad import zeroes the
        # whole app with a green tick on the deploy. Wait for the new build,
        # not merely for an answer.
        run: |
          set -euo pipefail
          BASE="https://${{ inputs.function_app }}.azurewebsites.net"
          EXPECT_SHA="${{ inputs.smoke_expect_sha }}"
          live=""
          for attempt in $(seq 1 20); do
            if body=$(curl -fsS --max-time 20 "${BASE}${{ inputs.smoke_path }}" 2>/dev/null); then
              live="$body"
              if [ "$EXPECT_SHA" != "true" ]; then
                break
              fi
              if echo "$body" | grep -q "${{ github.sha }}"; then
                break
              fi
              echo "attempt ${attempt}: still serving the previous build"
            else
              echo "attempt ${attempt}: host not answering yet"
            fi
            sleep 15
          done
          if [ -z "${live:-}" ]; then
            echo "::error::${{ inputs.smoke_path }} never answered after the deploy"
            exit 1
          fi
          if [ "$EXPECT_SHA" = "true" ] && ! echo "$live" | grep -q "${{ github.sha }}"; then
            echo "::error::host is answering but never started serving this commit"
            exit 1
          fi
          echo "healthz: $live"
