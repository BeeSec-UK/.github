# BeeSec shared gitleaks config.
#
# Extends the upstream default ruleset and then narrows ONE rule.
[extend]
useDefault = true

[allowlist]
description = "Paths where a key-shaped string is expected and is not a secret"

# Verified 2026-08-20 against all eight apps on the shared pipeline. Every
# generic-api-key hit was in one of these, and none was a credential:
#   local.settings.json.sample   sample config shipped for local dev
#   **/tests/**, **/fixtures/**  test data with deliberately fake tokens
#   infra/*.bicep                listKeys() expressions and Key Vault references
#   **/vendor/**                 vendored third-party source
#   docs/**.md                   documentation showing the shape of a value
#
# These are PATHS, not rules — a real AWS key or private key committed into any
# of them is still caught, because only the entropy-based generic rule is noisy
# enough to need this and the high-confidence rules are untouched.
paths = [
  '''.*\.sample$''',
  '''.*\.example$''',
  '''(^|/)tests?/''',
  '''(^|/)fixtures?/''',
  '''(^|/)vendor/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.venv/''',
  '''^infra/.*\.bicep$''',
  '''^docs/.*\.md$''',
  '''.*\.azurite\.ts$''',
  # scanner/app/data/attack_corpus.json is an adversarial-prompt corpus: a
  # living set of TEST samples that embed deliberately fake, secret-shaped
  # strings (e.g. "Access Code: ABC1234567890", example "tok_..." vendor
  # tokens) to exercise the prompt-leakage detector. Every gitleaks release
  # flags a different synthetic string in it, so a line-based ignore is
  # unworkable; this is the same "fake tokens in test data" case as tests/.
  '''(^|/)attack_corpus\.json$''',
]

# Azurite's emulator account is public and documented by Microsoft.
#
# App Insights connection strings are the same kind of thing: client-side
# telemetry INGESTION config, not a credential. The InstrumentationKey is a
# write-only ingestion id (no read access, no other resource) that Microsoft
# documents as non-secret and every browser/mobile SDK ships in the public
# bundle. On the fleet it arrives VITE_-prefixed, i.e. Vite inlines it into
# the SPA bundle that every visitor downloads. Scoped to the InstrumentationKey
# shape, so a real key elsewhere in the same string still fires.
regexTarget = "match"
regexes = [
  '''devstoreaccount1''',
  '''InstrumentationKey=[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}''',
]
