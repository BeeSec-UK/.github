# Starter for a BeeSec app-shaped repo (api/ Functions + web/ Vite SPA).
# Fill in the four resource names and delete the inputs you do not need —
# the full input list is documented in
# BeeSec-UK/.github/.github/workflows/beesec-app.yml.

name: Deploy $default-branch

on:
  push:
    branches: [$default-branch]
  # No base filter, so a pull request stacked on another branch is tested
  # rather than showing an empty check list. edited catches a retarget, and
  # also fires on a title or description edit, each a full test run.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs; never cancel a main deploy mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    # On the job rather than the top level. Every job of the shared workflow
    # gets this, tests included; deploys are held to main by their own checks.
    permissions:
      contents: read
      id-token: write # drop if using api_deploy_mode: publish-profile
    uses: BeeSec-UK/.github/.github/workflows/beesec-app.yml@main
    secrets: inherit
    with:
      function_app: func-CHANGEME-prod
      resource_group: rg-CHANGEME-prod
      storage_account: stCHANGEMEprod
      azure_client_id: 00000000-0000-0000-0000-000000000000
      azure_tenant_id: 7efd2461-9121-4d79-8c20-08c1564f2beb
      azure_subscription_id: 00000000-0000-0000-0000-000000000000
      frontend_build_env: |
        VITE_PLATFORM_TENANT_ID=7efd2461-9121-4d79-8c20-08c1564f2beb
        VITE_PLATFORM_CLIENT_ID=9bec4ecd-ac41-4f8e-a8f7-6317e195576e
        VITE_PLATFORM_API_SCOPE=api://beesec-internal/CHANGEME.access
        VITE_PLATFORM_API_BASE_URL=https://func-CHANGEME-prod.azurewebsites.net
